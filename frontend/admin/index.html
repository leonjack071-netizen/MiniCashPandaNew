<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniCashPanda Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #07152d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            background: #0d2142;
            border-radius: 22px;
            padding: 30px 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 25px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #8ea5c8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #dce8ff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #29456f;
            border-radius: 12px;
            background: #081a35;
            color: white;
            outline: none;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            border-color: #249cff;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: linear-gradient(135deg, #18a0fb, #2d5bff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #49e58a;
        }

        .error {
            color: #ff6b7a;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">🐼</div>

        <h1>MiniCashPanda</h1>

        <div class="subtitle">
            Admin Panel Login
        </div>

        <form id="loginForm">

            <label>Admin Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label>Admin Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginBtn">
                LOGIN
            </button>

        </form>

        <div id="message"></div>

    </div>

<script>

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    message.textContent = "";
    message.className = "";

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGIN...";

    try {

        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (data.success) {

            message.textContent = "Login successful!";
            message.className = "success";

            /*
             * Dashboard আমরা পরের Step-এ তৈরি করব।
             */

        } else {

            message.textContent =
                data.message || "Login failed";

            message.className = "error";
        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to server";

        message.className = "error";

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";
    }

});

</script>

</body>
</html>
