<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniCashPanda - Withdraw</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071525;
color:#fff;
padding:14px;
padding-bottom:90px;
min-height:100vh;
overflow-y:scroll;
}

.container{
max-width:390px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.logo{
font-size:22px;
font-weight:bold;
}

.userBox{
background:#132544;
padding:7px 14px;
border-radius:30px;
font-size:13px;
color:#BFD7FF;
}

.withdrawCard{
background:linear-gradient(135deg,#18A0FB,#2D5BFF);
padding:18px;
border-radius:22px;
box-shadow:0 10px 25px rgba(0,120,255,.30);
margin-bottom:15px;
}

.infoCard{
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.18);
border-radius:14px;
padding:12px;
margin-bottom:10px;
}

.infoTitle{
font-size:12px;
opacity:.85;
margin-bottom:5px;
}

.infoValue{
font-size:20px;
font-weight:bold;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:15px;
}

select,
input{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:14px;
border:none;
border-radius:12px;
background:#fff;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
color:#fff;
background:linear-gradient(90deg,#17C8FF,#2ED573);
cursor:pointer;
margin-top:10px;
}

button:active{
transform:scale(.98);
}

.bottomNav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#0A162D;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    border-top:1px solid rgba(255,255,255,.08);
}

.navItem{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color:#9DB8FF;
    font-size:12px;
    font-weight:bold;
}

.navActive{
    color:#20B8FF;
}

.navIcon{
    font-size:20px;
    margin-bottom:4px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
🐼 MiniCashPanda
</div>

<div class="userBox" id="headerTelegramId">
Loading...
</div>

</div>

<div class="withdrawCard">

<h1>Withdraw Balance</h1>

<div class="infoCard">
<div class="infoTitle">Minimum Withdraw</div>
<div class="infoValue">৳500</div>
</div>

<div class="infoCard">
<div class="infoTitle">Withdraw Fee</div>
<div class="infoValue">10%</div>
</div>

<select id="method">
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
</select>

<input
id="amount"
type="number"
placeholder="Enter Amount">

<input
id="accountNumber"
type="text"
placeholder="Enter bKash/Nagad Number">

<button id="withdrawBtn">
Submit Withdraw Request
</button>

</div>

</div>

<!-- Bottom Navigation -->

<div class="bottomNav">

<a href="/home/index.html" class="navItem">
    <span class="navIcon">🏠</span>
    <span>Home</span>
</a>

<a href="/profile/index.html" class="navItem">
    <span class="navIcon">👤</span>
    <span>Profile</span>
</a>

<a href="/withdraw/index.html" class="navItem navActive">
    <span class="navIcon">💸</span>
    <span>Withdraw</span>
</a>

<a href="/history/index.html" class="navItem">
    <span class="navIcon">📜</span>
    <span>History</span>
</a>

</div>

<script>

const telegramId = localStorage.getItem("telegramId");

document.getElementById("headerTelegramId").innerText =
"ID: " + (telegramId || "Loading");

document.getElementById("withdrawBtn").addEventListener("click",async()=>{

const amount=document.getElementById("amount").value.trim();
const accountNumber=document.getElementById("accountNumber").value.trim();
const method=document.getElementById("method").value;

if(!amount || !accountNumber){
alert("Please fill all fields.");
return;
}

try{

const response=await fetch("/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
telegramId,
amount,
accountNumber,
method
})
});

const data=await response.json();

alert(data.message);

if(data.success){
document.getElementById("amount").value="";
document.getElementById("accountNumber").value="";
}

}catch(err){
alert("Server Error!");
}

});

</script>

</body>
</html>
